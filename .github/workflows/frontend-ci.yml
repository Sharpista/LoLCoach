name: frontend-ci

# SCAFFOLD — o frontend Angular AINDA NÃO existe neste repositório.
# Os paths 'frontend/**' não correspondem a nenhum arquivo hoje, então este
# workflow não dispara. Quando o frontend for gerado, revise e ajuste os
# comandos abaixo conforme o projeto real (package manager, scripts do
# package.json, runner de testes, pasta de lockfile etc.).

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-test:
    name: Build e teste do frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          # Ajustar quando o frontend real existir (caminho do lockfile).
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Build
        working-directory: frontend
        run: npm run build

      # Opção 1: script de teste configurado no package.json.
      - name: Test
        working-directory: frontend
        run: npm test

      # Opção 2 (alternativa): Karma + ChromeHeadless no Angular.
      # Descomente se preferir chamar o ng test diretamente.
      # - name: Test (Angular + ChromeHeadless)
      #   working-directory: frontend
      #   run: npx ng test --watch=false --browsers=ChromeHeadless
