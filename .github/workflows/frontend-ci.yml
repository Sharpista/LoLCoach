name: frontend-ci

# Spec 008 / T-OPS-5 - o frontend Angular 22 existe neste repositório
# (`frontend/package.json`, `frontend/src`, `frontend/package-lock.json`).
# As guardas `hashFiles('frontend/package.json') != ''` que pulavam os passos e
# os comentários de "frontend ainda não existe" foram removidos: build e testes
# rodam de verdade. Node 24 alinha com o estágio de build do Dockerfile.

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-test:
    name: Build e teste do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # `npm ci` é determinístico e falha se o lockfile divergir do package.json.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build (produção)
        run: npm run build

      - name: Test
        run: npm test
