<header class="sticky top-0 z-40 border-b border-stone-200 bg-white/85 backdrop-blur-md transition-colors dark:border-stone-800 dark:bg-stone-950/85 dark:text-stone-100">
  <div class="mx-auto flex h-18 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a class="flex items-center gap-3 text-stone-900 dark:text-stone-100" routerLink="/" aria-label="LoLCoach — início">
      <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 font-display text-xl font-extrabold text-stone-950 shadow-sm">L</span>
      <span data-testid="brand-name" class="font-display text-lg font-bold tracking-tight">LoLCoach</span>
    </a>

    <nav class="flex items-center gap-3 sm:gap-6" aria-label="Navegação principal">
      <a
        class="rounded-lg px-2.5 py-1.5 text-sm font-medium text-stone-500 transition-colors hover:text-amber-600 dark:text-stone-400 dark:hover:text-amber-400"
        routerLink="/"
        routerLinkActive="text-amber-600 dark:text-amber-400"
        [routerLinkActiveOptions]="{ exact: true }"
        >Buscar</a
      >
      <a
        class="rounded-lg px-2.5 py-1.5 text-sm font-medium text-stone-500 transition-colors hover:text-amber-600 dark:text-stone-400 dark:hover:text-amber-400"
        [routerLink]="dashboardLink()"
        routerLinkActive="text-amber-600 dark:text-amber-400"
        >Dashboard</a
      >
    </nav>

    <button
      type="button"
      class="rounded-lg border border-stone-200 p-2 text-stone-600 transition-colors hover:bg-stone-100 dark:border-stone-800 dark:text-stone-300 dark:hover:bg-stone-900"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Alternar para modo claro' : 'Alternar para modo escuro'"
    >
      @if (theme.isDark()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      }
    </button>
  </div>
</header>
