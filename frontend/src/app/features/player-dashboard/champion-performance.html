<section class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm dark:border-stone-800 dark:bg-stone-900">
  <header class="mb-4">
    <span class="font-mono text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">Campeões</span>
  </header>
  <div class="flex flex-col">
    <div class="grid grid-cols-[1.5fr_1fr_1fr_1fr] items-center gap-2 border-b border-stone-200 px-1 py-3 font-mono text-[11px] uppercase tracking-wider text-stone-500 dark:border-stone-800">
      <span>Campeão</span>
      <span>Partidas</span>
      <span>Winrate</span>
      <span>KDA</span>
    </div>
    @for (c of champions(); track c.champion) {
      <div class="grid grid-cols-[1.5fr_1fr_1fr_1fr] items-center gap-2 border-b border-stone-100 px-1 py-3 text-sm last:border-b-0 dark:border-stone-800/60">
        <span class="font-semibold text-stone-900 dark:text-stone-100">{{ c.champion }}</span>
        <span class="tabular-nums text-stone-600 dark:text-stone-300">{{ c.games }}</span>
        <span class="tabular-nums text-stone-600 dark:text-stone-300">{{ c.winrate.toFixed(0) }}%</span>
        <span class="tabular-nums text-stone-600 dark:text-stone-300">{{ c.kda.toFixed(2) }}</span>
      </div>
    }
  </div>
</section>
