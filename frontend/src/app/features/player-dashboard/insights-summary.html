<section class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm dark:border-stone-800 dark:bg-stone-900">
  <header class="mb-4">
    <span class="font-mono text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">Principais insights</span>
  </header>
  <ol class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (item of items(); track item.id) {
      <li class="flex flex-col gap-2 rounded-xl border border-stone-200 bg-stone-50 p-5 dark:border-stone-800 dark:bg-stone-800">
        <div class="flex items-center justify-between gap-2">
          <span class="font-display text-lg font-extrabold text-amber-500 dark:text-amber-400">{{ $index + 1 }}</span>
          <span
            [class]="item.severity === 'high'
              ? 'inline-flex items-center rounded-full border border-amber-300/40 bg-amber-100 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-amber-900 dark:border-amber-500/30 dark:bg-amber-950 dark:text-amber-300'
              : 'inline-flex items-center rounded-full border border-stone-200 bg-stone-100 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-stone-600 dark:border-stone-700 dark:bg-stone-800 dark:text-stone-300'"
          >
            {{ item.label }}
          </span>
        </div>
        <h3 class="text-base leading-snug">{{ item.title }}</h3>
        <p class="text-sm text-stone-600 dark:text-stone-400">{{ item.description }}</p>
      </li>
    }
  </ol>
</section>
