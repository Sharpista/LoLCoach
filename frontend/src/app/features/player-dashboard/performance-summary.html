<section class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm dark:border-stone-800 dark:bg-stone-900">
  <header class="mb-4">
    <span class="font-mono text-xs font-semibold uppercase tracking-wider text-amber-600 dark:text-amber-400">Resumo de performance</span>
  </header>
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-6">
    @for (stat of stats(); track stat.label) {
      <div class="flex flex-col gap-1 rounded-xl border border-stone-200 bg-stone-50 px-4 py-3.5 dark:border-stone-800 dark:bg-stone-800">
        <span class="font-display text-2xl font-bold leading-tight text-amber-600 dark:text-amber-300">{{ stat.value }}</span>
        <span class="font-mono text-[11px] uppercase tracking-wider text-stone-500 dark:text-stone-400">{{ stat.label }}</span>
      </div>
    }
  </div>
</section>
