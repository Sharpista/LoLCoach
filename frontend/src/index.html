<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>LoLCoach — Analytics para League of Legends</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f5">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    // Aplica o tema salvo (ou o preferido pelo sistema) antes do bootstrap,
    // evitando flash de tema incorreto. Mantém a mesma chave do ThemeService.
    (function () {
      try {
        var key = 'lolcoach-theme';
        var saved = localStorage.getItem(key);
        var dark = saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', dark ? '#0c0a09' : '#faf8f5');
        }
      } catch (e) {
        /* no-op */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
